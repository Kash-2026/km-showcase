<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Traceability Engine</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; background: #f8f9fa; color: #212529; }
        .container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #1a202c; font-size: 1.6rem; }
        .section { margin-bottom: 1.5rem; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 6px; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 600; font-size: 0.85rem; }
        input, select { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-bottom: 0.75rem; border: 1px solid #cbd5e0; border-radius: 4px; }
        button { background: #2b6cb0; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { background: #2c5282; }
        .badge { display: inline-block; background: #edf2f7; color: #4a5568; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; margin: 0.2rem; }
        .badge-allergen { background: #feebc8; color: #7b341e; }
        .output { background: #edf2f7; padding: 0.75rem; border-radius: 4px; font-family: monospace; white-space: pre-wrap; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FoodTrace Engine Dashboard</h1>
        
        <div class="section" id="registered-lots-section">
            <h2>Active Ingredient Lots</h2>
            <div id="lots-list"></div>
        </div>

        <div class="section" id="production-section">
            <h2>Simulate Batch Production</h2>
            <label for="batch-id">Batch ID</label>
            <input type="text" id="batch-id" value="BAT-2025-01">
            
            <label for="product-name">Product Name</label>
            <input type="text" id="product-name" value="Almond Granola Bar">
            
            <label for="prod-date">Production Date</label>
            <input type="date" id="prod-date" value="2025-06-01">
            
            <label for="lot-selection">Select Ingredient Lots (Hold Ctrl/Cmd to select multiple)</label>
            <select id="lot-selection" multiple size="4"></select>

            <button id="btn-produce">Produce Batch</button>
            <div style="margin-top: 1rem;">
                <strong>Result:</strong>
                <div id="production-output" class="output">Ready to simulate.</div>
            </div>
        </div>

        <div class="section" id="recall-section">
            <h2>Recall Impact Query</h2>
            <label for="recall-lot-id">Select Target Lot for Recall</label>
            <select id="recall-lot-id"></select>
            <button id="btn-recall">Compute Affected Batches</button>
            <div style="margin-top: 1rem;">
                <strong>Affected Batches:</strong>
                <div id="recall-output" class="output">No recall active.</div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>


</body>
</html>
