<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LoanEngine Amortization & Accrual Calculator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; background: #f8fafc; color: #0f172a; }
    h1 { margin-bottom: 0.5rem; }
    .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    label { font-weight: 600; font-size: 0.875rem; display: block; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: none; padding: 0.75rem 1.5rem; font-weight: 600; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    th, td { border: 1px solid #e2e8f0; padding: 0.5rem 0.75rem; text-align: right; }
    th { background: #f1f5f9; font-weight: 600; text-align: right; }
    th:first-child, td:first-child { text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Loan Amortization Engine</h1>
    <p>Generate exact reducing-balance schedules and daily accruals.</p>
    <div class="form-grid">
      <div>
        <label for="principal">Principal ($)</label>
        <input id="principal" type="number" step="0.01" value="10000.00">
      </div>
      <div>
        <label for="annualRate">Annual Rate (%)</label>
        <input id="annualRate" type="number" step="0.01" value="7.50">
      </div>
      <div>
        <label for="months">Tenor (Months)</label>
        <input id="months" type="number" step="1" value="12">
      </div>
    </div>
    <button id="calcBtn">Generate Schedule</button>
    <table id="scheduleTable">
      <thead>
        <tr>
          <th>Month</th>
          <th>Payment ($)</th>
          <th>Principal ($)</th>
          <th>Interest ($)</th>
          <th>Ending Balance ($)</th>
        </tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>
  <script src="index.js"></script>


</body>
</html>
