<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Token Service Sandbox</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; background: #f7f9fc; color: #2d3748; }
        .container { max-width: 680px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #1a202c; font-size: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 600; font-size: 0.9rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; }
        .buttons { display: flex; gap: 0.5rem; margin-top: 1rem; }
        button { padding: 0.5rem 1rem; border: none; border-radius: 4px; background: #3182ce; color: white; font-weight: 600; cursor: pointer; }
        button:hover { background: #2b6cb0; }
        button.secondary { background: #4a5568; }
        button.secondary:hover { background: #2d3748; }
        pre { background: #1a202c; color: #e2e8f0; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OAuth Token Service Sandbox</h1>
        <div class="form-group">
            <label for="clientId">Client ID</label>
            <input id="clientId" value="client_demo" placeholder="e.g. client_demo">
        </div>
        <div class="form-group">
            <label for="scope">Scope</label>
            <input id="scope" value="read write profile" placeholder="e.g. read write">
        </div>
        <div class="buttons">
            <button id="btnIssue">Issue Token</button>
        </div>

        <div class="form-group" style="margin-top: 1.5rem;">
            <label for="bearerToken">Active Bearer Token</label>
            <input id="bearerToken" placeholder="Issued token will appear here">
        </div>
        <div class="buttons">
            <button id="btnValidate" class="secondary">Validate Token</button>
            <button id="btnRefresh" class="secondary">Refresh Token</button>
        </div>

        <h2 style="font-size: 1.1rem; margin-top: 1.5rem;">Output Log</h2>
        <pre id="output">Waiting for action...</pre>
    </div>
    <script src="index.js"></script>

</body>
</html>
