<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Deadline Calculator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 2rem;
      background: #f8fafc;
      color: #1e293b;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 1.5rem 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
      color: #0f172a;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
      font-size: 0.875rem;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .checkbox-group input {
      width: auto;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
    }
    button:hover {
      background: #1d4ed8;
    }
    #result-box {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f1f5f9;
      border-radius: 6px;
      border-left: 4px solid #2563eb;
      display: none;
    }
    .result-item {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Deadline Calculator</h1>
    <div class="form-group">
      <label for="start-date">Start Date</label>
      <input type="date" id="start-date">
    </div>
    <div class="form-group">
      <label for="days-count">Number of Days</label>
      <input type="number" id="days-count" min="0" value="5">
    </div>
    <div class="form-group">
      <label for="calc-type">Calculation Method</label>
      <select id="calc-type">
        <option value="court">Court Days (Business Days)</option>
        <option value="calendar">Calendar Days</option>
      </select>
    </div>
    <div class="form-group checkbox-group" id="roll-forward-container" style="display: none;">
      <input type="checkbox" id="roll-forward" checked>
      <label for="roll-forward" style="margin-bottom: 0;">Roll forward to next court day if weekend/holiday</label>
    </div>
    <div class="form-group">
      <label for="holidays">Holidays (comma-separated YYYY-MM-DD)</label>
      <input type="text" id="holidays" placeholder="e.g. 2024-05-27, 2024-07-04">
    </div>
    <button id="calc-btn">Compute Deadline</button>

    <div id="result-box">
      <div class="result-item" id="computed-deadline"></div>
      <div class="result-item" id="days-remaining"></div>
    </div>
  </div>

  <script src="index.js"></script>

</body>
</html>
