<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Market Technical & Valuation Engine</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #38bdf8;
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    input {
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    button {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
      font-weight: 600;
    }
    button:hover {
      background: #0369a1;
    }
    .results {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .card {
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .card-title {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .card-value {
      font-size: 1.25rem;
      font-weight: bold;
      color: #38bdf8;
      margin-top: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid #334155;
      padding: 6px 10px;
      text-align: left;
    }
    th {
      background: #0f172a;
      color: #94a3b8;
    }
    .tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0369a1;
      font-size: 0.75rem;
      color: #e0f2fe;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Market Technical & Valuation Engine</h1>

    <div class="panel">
      <h2>Valuation Metrics Calculator</h2>
      <div class="row">
        <div>
          <label for="price">Stock Price ($)</label>
          <input type="number" id="price" value="150.00" step="0.01">
        </div>
        <div>
          <label for="trailing_eps">Trailing EPS ($)</label>
          <input type="number" id="trailing_eps" value="6.00" step="0.01">
        </div>
        <div>
          <label for="forward_eps">Forward EPS ($)</label>
          <input type="number" id="forward_eps" value="7.50" step="0.01">
        </div>
        <div>
          <label for="eps_growth">EPS Growth (%)</label>
          <input type="number" id="eps_growth" value="15.00" step="0.01">
        </div>
      </div>
      <button id="calcValuationBtn">Compute Valuation</button>
      <div class="results" id="valResults">
        <div class="card">
          <div class="card-title">Trailing P/E</div>
          <div class="card-value" id="valTrailingPe">-</div>
        </div>
        <div class="card">
          <div class="card-title">Forward P/E</div>
          <div class="card-value" id="valForwardPe">-</div>
        </div>
        <div class="card">
          <div class="card-title">PEG Ratio</div>
          <div class="card-value" id="valPegRatio">-</div>
        </div>
        <div class="card">
          <div class="card-title">Earnings Yield</div>
          <div class="card-value" id="valEarningsYield">-</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Technical Patterns &amp; EMA Preview</h2>
      <button id="runPatternBtn">Detect Patterns &amp; Compute EMA(3)</button>
      <canvas id="candleChart" width="600" height="300" style="width:100%;height:300px;background:#0b1120;border:1px solid #334155;border-radius:6px;margin-bottom:16px;"></canvas>
      <table id="candleTable">
        <thead>
          <tr>
            <th>Index</th>
            <th>Open</th>
            <th>High</th>
            <th>Low</th>
            <th>Close</th>
            <th>EMA(3)</th>
            <th>Detected Patterns</th>
          </tr>
        </thead>
        <tbody id="candleBody"></tbody>
      </table>
    </div>
  </div>

  <script src="index.js"></script>


</body>
</html>
