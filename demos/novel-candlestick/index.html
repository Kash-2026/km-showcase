<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Candlestick Chart Engine</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --ema: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1.5rem; font-weight: 600; }
    .badge {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--border);
    }
    .badge.up { background: rgba(34, 197, 94, 0.2); color: var(--green); border: 1px solid var(--green); }
    .badge.down { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }
    .badge.neutral { background: var(--border); color: var(--text-muted); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .canvas-container {
      width: 100%;
      height: 400px;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .legend {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    th, td {
      padding: 10px 14px;
      text-align: right;
      border-bottom: 1px solid var(--border);
    }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--text-muted); font-weight: 500; }
    .tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      background: #475569;
      color: #fff;
      margin-left: 4px;
    }
    .tag.doji { background: #ca8a04; }
    .tag.hammer { background: #2563eb; }
    .tag.bullish_engulfing { background: #16a34a; }
  </style>
<style id="km-neon-theme">
/* KashMakr Neon Glassmorphic Theme — shared override injected into every demo.
   Targets common Kashmakr demo classes + generic elements so it works across
   all deliverables regardless of their specific markup. !important on
   color/background/border/shadow to override per-demo styling; layout is left
   intact to avoid breaking grids. */
:root{
  --km-bg:#0a0612; --km-bg2:#140a24; --km-accent:#a855f7; --km-accent2:#d946ef;
  --km-green:#34d399; --km-red:#f87171; --km-text:#ffffff; --km-muted:#c4b5fd;
}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #1a0b2e 0%, #0a0612 60%) !important;
  color:var(--km-text) !important;
  font-weight:500 !important;
}
h1,h2,h3,h4{color:#ffffff !important;font-weight:800 !important;letter-spacing:-0.2px;}
h1{font-size:1.6rem;}
a{color:var(--km-accent2) !important;}
p,label,.subtitle,.muted{color:var(--km-muted) !important;}

/* Glassmorphic cards / panels / result boxes */
.card,.panel,.container,.kpi-card,.metric,.results,.result-box,.result-item,
.card-value,.kpi-value,.form-group,.field,.row,.legend-item,.form-grid,
.section,.stat,.stat-card,.output{
  background:rgba(168,85,247,0.07) !important;
  border:1px solid rgba(168,85,247,0.28) !important;
  border-radius:14px !important;
  backdrop-filter:blur(12px) !important;
  -webkit-backdrop-filter:blur(12px) !important;
  box-shadow:0 8px 28px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06) !important;
  color:var(--km-text) !important;
}
.card-title,.kpi-title,.metric,.label{color:#e9d5ff !important;font-weight:700;}
.card-value,.kpi-value,.metric-value,.total,.stat-value{
  color:#ffffff !important;font-weight:800 !important;
  text-shadow:0 0 18px rgba(217,70,239,0.35) !important;
}

/* Neumorphic 2D buttons */
button,.btn,button[type=submit],input[type=submit],input[type=button]{
  background:linear-gradient(135deg,#a855f7,#d946ef) !important;
  color:#0a0612 !important;
  font-weight:800 !important;
  border:none !important;
  border-radius:12px !important;
  box-shadow:0 4px 0 #6b21a8, 0 6px 18px rgba(168,85,247,0.4) !important;
  cursor:pointer !important;
  transition:transform .12s, box-shadow .12s !important;
}
button:hover,.btn:hover{transform:translateY(-2px) !important;box-shadow:0 6px 0 #6b21a8, 0 10px 26px rgba(168,85,247,0.55) !important;}
button:active,.btn:active{transform:translateY(2px) !important;box-shadow:0 2px 0 #6b21a8 !important;}
button.secondary,.btn.secondary{background:rgba(168,85,247,0.12) !important;color:#e9d5ff !important;box-shadow:0 3px 0 rgba(107,33,168,0.6) !important;border:1px solid rgba(168,85,247,0.4) !important;}

/* Inputs / selects / textareas — dark glass */
input,select,textarea{
  background:rgba(10,6,18,0.6) !important;
  border:1px solid rgba(168,85,247,0.35) !important;
  border-radius:10px !important;
  color:#ffffff !important;
  font-weight:600 !important;
}
input:focus,select:focus,textarea:focus{outline:none !important;border-color:var(--km-accent2) !important;box-shadow:0 0 0 3px rgba(217,70,239,0.25) !important;}
input[type=checkbox],input[type=radio]{accent-color:var(--km-accent) !important;width:auto !important;}

/* Tables — dark glass */
table{background:rgba(168,85,247,0.05) !important;border-radius:12px !important;overflow:hidden;}
th{background:rgba(168,85,247,0.15) !important;color:#ffffff !important;font-weight:800 !important;border-bottom:1px solid rgba(168,85,247,0.35) !important;}
td{color:#e9d5ff !important;border-bottom:1px solid rgba(168,85,247,0.15) !important;}
tr:hover td{background:rgba(168,85,247,0.08) !important;}

/* Canvas charts — dark bg + neon purple frame */
canvas{background:#0b0714 !important;border:1px solid rgba(168,85,247,0.4) !important;border-radius:12px !important;box-shadow:0 0 24px rgba(168,85,247,0.18) !important;}

/* Status / badges */
.status-ok,.valid,.badge-ok,.success{color:#a7f3d0 !important;background:rgba(52,211,153,0.14) !important;border:1px solid rgba(52,211,153,0.5) !important;border-radius:8px !important;padding:2px 10px !important;}
.status-conflict,.invalid,.badge-error,.error,.status-error{color:#fecaca !important;background:rgba(248,113,113,0.14) !important;border:1px solid rgba(248,113,113,0.5) !important;border-radius:8px !important;padding:2px 10px !important;}

/* Log lists */
.log-list,.log-list li,.log-entry{background:transparent !important;color:var(--km-muted) !important;border-color:rgba(168,85,247,0.2) !important;}
.log-list li{border-bottom:1px solid rgba(168,85,247,0.15) !important;}

/* Tag / pill */
.tag,.pill,.badge{background:rgba(168,85,247,0.15) !important;color:#e9d5ff !important;border:1px solid rgba(168,85,247,0.35) !important;border-radius:8px !important;}
</style>
</head>
<body>
  <header>
    <h1>Candlestick Chart Engine (EMA-3 Overlay)</h1>
    <div>Trend: <span id="trend-badge" class="badge">--</span></div>
  </header>

  <div class="card">
    <div class="canvas-container">
      <canvas id="chartCanvas"></canvas>
    </div>
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background: var(--green);"></span> Bullish Candle</div>
      <div class="legend-item"><span class="dot" style="background: var(--red);"></span> Bearish Candle</div>
      <div class="legend-item"><span class="dot" style="background: var(--ema);"></span> EMA (Period 3)</div>
      <div class="legend-item"><span class="dot" style="background: #eab308;"></span> Pattern Signal</div>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size: 1.1rem; margin-bottom: 12px;">Candle Log & Technical Indicators</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Open</th>
          <th>High</th>
          <th>Low</th>
          <th>Close</th>
          <th>EMA (3)</th>
          <th>Detected Patterns</th>
        </tr>
      </thead>
      <tbody id="candle-data"></tbody>
    </table>
  </div>

  <script src="index.js"></script>
<!-- km:dom-controller -->
<script>
(function () {
  "use strict";
  function findOutput() {
    return document.querySelector(
      "[data-km-output], #output, #result, #results, #preview, pre, main, [role='main']"
    );
  }
  function render(text) {
    var out = findOutput();
    if (!out) {
      out = document.createElement("pre");
      out.id = "km-runtime-output";
      document.body.appendChild(out);
    }
    out.textContent = text;
  }
  function readForm(form) {
    var data = {};
    var fields = form.querySelectorAll("input[name], textarea[name], select[name]");
    for (var i = 0; i < fields.length; i += 1) {
      var el = fields[i];
      if (el.type === "submit" || el.type === "button") continue;
      data[el.name] = el.value;
    }
    return data;
  }
  function bind() {
    var forms = document.querySelectorAll("form");
    for (var i = 0; i < forms.length; i += 1) {
      forms[i].addEventListener("submit", function (event) {
        event.preventDefault();
        var payload = readForm(this);
        render(JSON.stringify(payload, null, 2));
      });
    }
    var buttons = document.querySelectorAll("button, [role='button']");
    for (var j = 0; j < buttons.length; j += 1) {
      buttons[j].addEventListener("click", function (event) {
        if (event && event.preventDefault) event.preventDefault();
        render("ready");
      });
    }
    if (document.body && !document.body.getAttribute("data-km-ready")) {
      document.body.setAttribute("data-km-ready", "1");
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>
<!-- /km:dom-controller -->
</body>
</html>
